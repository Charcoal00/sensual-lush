<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f8f8;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .form-container {
            background: #fff;
            padding: 20px;
            margin: 20px auto;
            width: 40%;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            text-align: left;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px 15px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <h1>Feedback & Booking Forms</h1>

    <!-- Feedback Form -->
    <div class="form-container">
        <h2>Feedback Form</h2>
        <form id="feedbackForm">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="request">Request:</label>
            <textarea id="request" name="request" rows="4" required></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
    </div>

    <!-- Booking Form -->
    <div class="form-container">
        <h2>Booking Form</h2>
        <form id="bookingForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="therapy">Therapy Option:</label>
            <input type="text" id="therapy" name="therapy" required>

            <label for="note">Note:</label>
            <textarea id="note" name="note" rows="4"></textarea>

            <label for="therapist">Therapist Option:</label>
            <input type="text" id="therapist" name="therapist" required>

            <button type="submit">Submit Booking</button>
        </form>
    </div>
</body>
<script src="./component/form.js"></script>

</html>
